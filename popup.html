<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 260px; }
    h1 { font-size: 13px; margin: 0 0 10px; }
    fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
    legend { font-weight: 600; margin-bottom: 6px; }
    label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    small { display: block; opacity: .7; }
    #saved { margin-top: 10px; min-height: 1em; opacity: .7; }
  </style>
</head>
<body>
  <h1>GitHub PR File Filter</h1>
  <fieldset>
    <legend>Ao carregar cada arquivo do PR</legend>
    <label>
      <input type="radio" name="expandMode" value="collapsed">
      <span>Colapsado<small>Só os trechos alterados (padrão do GitHub)</small></span>
    </label>
    <label>
      <input type="radio" name="expandMode" value="expanded">
      <span>Expandido<small>Arquivo inteiro, com todas as linhas</small></span>
    </label>
  </fieldset>
  <div id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
